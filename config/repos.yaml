# Target-repo registry. `cgx extract --repo <id>` resolves against this file.
neo4j:
  uri: bolt://localhost:7687
  user: neo4j
  password: cgxpassword
  database: neo4j

repos:
  - id: minirepo
    path: fixtures/minirepo
    package_root: fixtures # dir that the top-level package sits inside
    # contamination metadata (Phase 4 populates these for real repos)
    created_at: null
    last_commit_at: null
    source: fixture
  - id: django
    # Repo root contains the `django/` package, so the repo root is the package
    # root. `fixtures` here named every module `django.django.*`.
    path: fixtures/django
    package_root: fixtures/django
    # contamination metadata (Phase 4 populates these for real repos)
    created_at: null
    last_commit_at: null
    source: fixture
  - id: odysseus
    # Flat application, not an installable package: imports are `from src.`,
    # `from core.`, `from routes.`, so the repo root IS the package root.
    # Pointing package_root one level up would prefix every module with
    # `odysseus.` and misname every referent in every question.
    path: fixtures/odysseus
    package_root: fixtures/odysseus
    created_at: 2026-05-31
    last_commit_at: 2026-09-13
    source: github
    url: https://github.com/odysseus-dev/odysseus
    license: AGPL-3.0
    stars: 87199

