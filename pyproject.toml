[project]
name = "cgx"
version = "0.1.0"
description = "Graph-derived repository QA benchmark, extending the CodexGraph schema with CALLS edges"
requires-python = ">=3.10"
dependencies = [
    "pyan3>=2.8.1",
    "neo4j>=5.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "anthropic>=0.70",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cgx = "cgx.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cgx"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
